name: studenttrack

# Контейнерное окружение StudentTrack (ЛР4).
#
# Архитектура:  nginx (порт 8080) -> web x2 (gunicorn, непривилегированный) -> db (PostgreSQL)
#
# Эксплуатационные требования (см. CONTRIBUTING.md):
#   - тегов latest нет (образы запинованы);
#   - приложение не работает от root;
#   - секреты передаются только через переменные окружения (.env), в образ не попадают;
#   - healthcheck у каждого сервиса, отключать нельзя;
#   - публикуется только порт nginx (8080); порт БД не публикуется
#     (для локальной разработки есть docker-compose.dev.yml).

services:
  db:
    image: postgres:16-alpine
    container_name: studenttrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studenttrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studenttrack}
      POSTGRES_DB: ${POSTGRES_DB:-studenttrack}
    expose:
      # Порт доступен только внутри сети backend, на хост не публикуется.
      - "5432"
    volumes:
      - studenttrack_pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    # PostgreSQL при получении SIGTERM делает «fast shutdown»; даём время доработать транзакции.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  web:
    build: .
    image: studenttrack-web:1.0.0
    restart: unless-stopped
    environment:
      # Подстановка значений происходит на этапе `docker compose config`
      # из .env / окружения хоста, а не внутри контейнера.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studenttrack}:${POSTGRES_PASSWORD:-studenttrack}@db:5432/${POSTGRES_DB:-studenttrack}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      APP_PORT: 5000
      FLASK_ENV: production
    expose:
      # Прямой доступ к приложению с хоста запрещён: только через nginx.
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # gunicorn корректно завершается по SIGTERM: мастер-процесс дожидается
    # завершения воркеров, обрабатывающих текущие запросы.
    stop_grace_period: 30s
    deploy:
      # Два экземпляра приложения за балансировщиком (доп. задание ЛР4).
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    container_name: studenttrack_nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      # Единственный опубликованный порт окружения.
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      # frontend — внешняя сеть для опубликованного порта
      # (порты контейнера, висящего только на internal-сети, с хоста недоступны);
      # backend — внутренняя сеть, через неё nginx ходит в web.
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  frontend:
    # Сеть входа: только nginx, через неё публикуется порт 8080.
    driver: bridge
  backend:
    # Контейнерам не нужен выход в интернет: только взаимодействие между сервисами.
    internal: true
    driver: bridge

volumes:
  studenttrack_pgdata:
