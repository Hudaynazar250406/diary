name: studenttrack

# ЛР4/ЛР5: nginx -> web x2 -> PostgreSQL; БД не публикуется на хост.
services:
  db:
    # Сохраняем версию существующего volume, не понижаем до PostgreSQL 15.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studenttrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-studenttrack}
    expose: ["5432"]
    volumes:
      - studenttrack_pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  web:
    build: .
    image: studenttrack-web:1.0.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studenttrack}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-studenttrack}
      SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY}
      APP_PORT: 5000
      FLASK_ENV: production
    expose: ["5000"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports: ["8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ДОПУЩЕНИЕ: локальная демонстрация без аутентификации, только loopback.
  registry:
    image: registry:2
    profiles: ["registry"]
    restart: unless-stopped
    ports: ["127.0.0.1:5000:5000"]
    volumes:
      - registry_data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/v2/"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  frontend:
    driver: bridge
  backend:
    internal: true
    driver: bridge

volumes:
  studenttrack_pgdata:
  registry_data:
