workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'

stages:
  - lint
  - test
  - migrations
  - backup
  - security
  - container-check
  - build
  - container-scan
  - publish

variables:
  GIT_DEPTH: "0"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

default:
  interruptible: true
  hooks:
    pre_get_sources_script:
      - git config --global url."http://host.docker.internal:8929/".insteadOf "http://localhost:8929/"

.check-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'

.python-job:
  extends: .check-rules
  image: python:3.13-slim
  tags: [lab5-python]
  cache:
    key:
      files: [requirements.txt]
    paths: [.cache/pip/]
  before_script:
    - set -eu
    - sed -i -e 's|http://deb.debian.org|https://deb.debian.org|g' -e 's|http://security.debian.org|https://security.debian.org|g' /etc/apt/sources.list.d/debian.sources
    - apt-get update -qq
    - apt-get install -y --no-install-recommends make git postgresql-client
    - python -m pip install -r requirements.txt
    - mkdir -p reports backups

.postgres-job:
  extends: .python-job
  services:
    - name: postgres:15
      alias: postgres
  variables:
    POSTGRES_USER: studenttrack_ci
    POSTGRES_DB: studenttrack_test
    POSTGRES_PASSWORD: "$TEST_DB_PASSWORD"
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: studenttrack_ci
    PGDATABASE: studenttrack_test
    PGPASSWORD: "$TEST_DB_PASSWORD"
    SECRET_KEY: "$TEST_DB_PASSWORD"
    PYTEST_WORKERS: "0"
  before_script:
    - !reference [.python-job, before_script]
    - export DATABASE_URL="postgresql+psycopg://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
    - export TEST_DATABASE_URL="${DATABASE_URL}"
    - for attempt in $(seq 1 60); do pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" && break; test "$attempt" = 60 && exit 1; sleep 2; done
    - psql --no-password -v ON_ERROR_STOP=1 -Atqc "SELECT 1"

config-guard:
  extends: .check-rules
  stage: lint
  image: python:3.13-slim
  tags: [lab5-python]
  before_script:
    - set -eu
    - sed -i -e 's|http://deb.debian.org|https://deb.debian.org|g' -e 's|http://security.debian.org|https://security.debian.org|g' /etc/apt/sources.list.d/debian.sources
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git bash
    - mkdir -p reports
  script:
    - git fetch --no-tags origin "${CI_DEFAULT_BRANCH}" || true
    - test -f scripts/check_critical_files.sh
    - bash scripts/check_critical_files.sh | tee reports/config-guard.log
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/config-guard.log]

lint:
  extends: .python-job
  stage: lint
  needs: [{job: config-guard, artifacts: false}]
  script: [make quality]
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/flake8.log]

test:
  extends: .postgres-job
  stage: test
  needs: [{job: lint, artifacts: false}]
  variables:
    PYTEST_ADDOPTS: "--junitxml=reports/junit.xml"
  script: [make test]
  artifacts:
    when: always
    expire_in: 30 days
    reports: {junit: reports/junit.xml}
    paths: [reports/junit.xml]

coverage:
  extends: .postgres-job
  stage: test
  needs: [{job: lint, artifacts: false}]
  script:
    - python -m pytest --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=80 -q -n 0
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
    paths: [reports/coverage.xml]

health:
  extends: .python-job
  stage: test
  needs: [{job: lint, artifacts: false}]
  script: [make health]
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/health.log]

migrations:
  extends: .postgres-job
  stage: migrations
  needs:
    - {job: test, artifacts: false}
    - {job: coverage, artifacts: false}
    - {job: health, artifacts: false}
  script:
    - CI=true python -m flask --app run db upgrade 2>&1 | tee reports/migrations.log
    - python -m flask --app run db current >> reports/migrations.log
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/migrations.log]

backup:
  extends: .postgres-job
  stage: backup
  needs: [{job: migrations, artifacts: false}]
  script:
    - pg_dump --no-password --format=custom --file=backups/ci.dump
    - pg_restore --list backups/ci.dump > reports/backup-contents.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths: [backups/ci.dump, reports/backup-contents.txt]

gitleaks:
  extends: .check-rules
  stage: security
  image:
    name: zricethezav/gitleaks:v8.24.3
    entrypoint: [""]
  tags: [lab5-python]
  needs: [{job: backup, artifacts: false}]
  script:
    - mkdir -p reports
    - gitleaks git . --redact --exit-code 1 --report-format sarif --report-path reports/gitleaks.sarif
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/gitleaks.sarif]

pip-audit:
  extends: .python-job
  stage: security
  needs: [{job: backup, artifacts: false}]
  script:
    - python -m pip install pip-audit==2.9.0
    - python -m pip_audit --requirement requirements.txt --format=json --output=reports/pip-audit.json
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/pip-audit.json]

trivy-fs:
  extends: .check-rules
  stage: security
  image:
    name: aquasec/trivy:0.76.1
    entrypoint: [""]
  tags: [lab5-python]
  needs: [{job: backup, artifacts: false}]
  script:
    - mkdir -p reports
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --format sarif --output reports/trivy-fs.sarif .
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/trivy-fs.sarif]

.docker-job:
  extends: .check-rules
  tags: [lab5-docker]
  resource_group: lab5-docker-host
  before_script:
    - set -eu
    - mkdir -p reports
    - docker version
    - docker compose version
    - docker buildx version

container-check:
  extends: .docker-job
  stage: container-check
  needs:
    - {job: gitleaks, artifacts: false}
    - {job: pip-audit, artifacts: false}
    - {job: trivy-fs, artifacts: false}
  script:
    - export COMPOSE_PROJECT_NAME="lab5-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    - export POSTGRES_USER=studenttrack_ci POSTGRES_DB=studenttrack_ci POSTGRES_PASSWORD="$TEST_DB_PASSWORD" SECRET_KEY="$TEST_DB_PASSWORD"
    - cp .env.example .env
    - trap 'docker compose logs --no-color > reports/compose.log 2>&1 || true; docker compose down -v --remove-orphans || true; rm -f .env' EXIT
    - make container-check PYTHON=python3 2>&1 | tee reports/container-check.log
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/container-check.log, reports/compose.log]

build:
  extends: .docker-job
  stage: build
  needs: [{job: container-check, artifacts: false}]
  script:
    - builder="lab5-${CI_JOB_ID}"
    - trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
    - docker buildx create --name "$builder" --driver docker-container --use
    - docker buildx build --pull --load --tag "studenttrack:${CI_COMMIT_SHA}" --file Dockerfile . 2>&1 | tee reports/build.log
    - docker save "studenttrack:${CI_COMMIT_SHA}" | gzip > image.tar.gz
  artifacts:
    when: always
    expire_in: 30 days
    paths: [image.tar.gz, reports/build.log]

trivy-image:
  extends: .check-rules
  stage: container-scan
  image:
    name: aquasec/trivy:0.76.1
    entrypoint: [""]
  tags: [lab5-python]
  needs: [{job: build, artifacts: true}]
  script:
    - mkdir -p reports
    - trivy image --input image.tar.gz --scanners vuln,secret --severity HIGH,CRITICAL --format sarif --output reports/trivy-image.sarif
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/trivy-image.sarif]

publish:
  extends: .docker-job
  stage: publish
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  needs:
    - {job: build, artifacts: true}
    - {job: trivy-image, artifacts: false}
  script:
    - test -n "${CI_REGISTRY:-}" || { echo "Registry is not configured"; exit 1; }
    - test -n "${CI_REGISTRY_IMAGE:-}" || { echo "CI_REGISTRY_IMAGE is not set"; exit 1; }
    - export DOCKER_CONFIG="$(mktemp -d)"
    - trap 'rm -rf "$DOCKER_CONFIG"' EXIT
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker load --input image.tar.gz
    - docker tag "studenttrack:${CI_COMMIT_SHA}" "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
    - docker push "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"