workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'

stages:
  - lint
  - test
  - migrations
  - backup
  - security
  - container-check
  - build
  - publish

variables:
  GIT_DEPTH: "0"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Доверенный bootstrap-коммит этой поставки. Сохранить его в истории GitLab.
  GUARD_BOOTSTRAP_SHA: "18b0ced0145439a5c10fa976f1ce9501858b758a"

default:
  interruptible: true

.python-job:
  image: python:3.13-slim
  tags: [lab5-python]
  cache:
    key:
      files: [requirements.txt, requirements-ci.txt]
    paths: [.cache/pip/]
  before_script:
    - set -euo pipefail
    - apt-get update -qq
    - apt-get install -y --no-install-recommends make git postgresql-client
    - python -m pip install -r requirements.txt -r requirements-ci.txt
    - mkdir -p reports backups

.postgres-job:
  extends: .python-job
  services:
    - name: postgres:15
      alias: postgres
  variables:
    POSTGRES_USER: studenttrack_ci
    POSTGRES_DB: studenttrack_test
    POSTGRES_PASSWORD: "$CI_JOB_TOKEN"
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: studenttrack_ci
    PGDATABASE: studenttrack_test
    PGPASSWORD: "$CI_JOB_TOKEN"
    SECRET_KEY: "$CI_JOB_TOKEN"
    PYTEST_WORKERS: "0"
  before_script:
    - !reference [.python-job, before_script]
    - |
      export DATABASE_URL="postgresql+psycopg://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
      export TEST_DATABASE_URL="${DATABASE_URL}"
      ready=0
      for attempt in $(seq 1 60); do
        if pg_isready >/dev/null 2>&1; then ready=1; break; fi
        sleep 2
      done
      test "${ready}" = 1
      psql --no-password -v ON_ERROR_STOP=1 -Atqc 'SELECT 1'

.docker-job:
  # ДОПУЩЕНИЕ: выделенная VM, Shell executor с Bash и Docker/Compose/Buildx.
  tags: [lab5-docker]
  resource_group: lab5-docker-host
  cache: []
  before_script:
    - set -euo pipefail
    - mkdir -p reports
    - docker version
    - docker compose version
    - docker buildx version
    - |
      export IMAGE_REGISTRY="${LAB_REGISTRY_HOST:-${CI_REGISTRY}}"
      export IMAGE_REPOSITORY="${LAB_REGISTRY_IMAGE:-${CI_REGISTRY_IMAGE}}"
      export IMAGE_REF="${IMAGE_REPOSITORY}:${CI_COMMIT_SHA}"

config-guard:
  extends: .python-job
  stage: lint
  needs: []
  script:
    - |
      git fetch --no-tags origin "${CI_DEFAULT_BRANCH}"
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        export GUARD_BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
      elif [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ]; then
        export GUARD_BASE_SHA="${CI_COMMIT_BEFORE_SHA}"
        if [ -z "${GUARD_BASE_SHA}" ] || [ "${GUARD_BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
          export GUARD_BASE_SHA="${GUARD_BOOTSTRAP_SHA}"
        fi
      else
        export GUARD_BASE_SHA="$(git merge-base HEAD "origin/${CI_DEFAULT_BRANCH}")"
      fi
      # Первоначальная main может ещё не содержать guard.
      # Для bootstrap берём скрипт из зафиксированного коммита поставки.
      trusted="${GUARD_BASE_SHA}"
      if ! git cat-file -e "${trusted}:scripts/check_critical_files.py" 2>/dev/null; then
        trusted="${GUARD_BOOTSTRAP_SHA}"
      fi
      git cat-file -e "${trusted}^{commit}"
      git show "${trusted}:scripts/check_critical_files.py" > /tmp/lab5-guard.py
      python /tmp/lab5-guard.py 2>&1 | tee reports/config-guard.log
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/config-guard.log]

lint:
  extends: .python-job
  stage: lint
  needs: [{job: config-guard, artifacts: false}]
  script:
    - make quality 2>&1 | tee reports/flake8.log
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/flake8.log]

test:
  extends: .postgres-job
  stage: test
  needs: [{job: lint, artifacts: false}]
  variables:
    PYTEST_ADDOPTS: "--junitxml=reports/junit.xml"
  script:
    - make test
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: reports/junit.xml
    paths: [reports/junit.xml]

coverage:
  extends: .postgres-job
  stage: test
  needs: [{job: lint, artifacts: false}]
  variables:
    PYTEST_ADDOPTS: "--cov-report=xml:reports/coverage.xml"
  script:
    - make coverage
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
    paths: [reports/coverage.xml]

health:
  extends: .python-job
  stage: test
  needs: [{job: lint, artifacts: false}]
  script:
    - make health 2>&1 | tee reports/health.log
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/health.log]

migrations:
  extends: .postgres-job
  stage: migrations
  needs: [test, coverage, health]
  script:
    - make migrate 2>&1 | tee reports/migrations.log
    - python -m flask --app run db current >> reports/migrations.log
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/migrations.log]

backup:
  extends: .postgres-job
  stage: backup
  needs: [{job: migrations, artifacts: false}]
  script:
    # БД между jobs не разделяется: применяем миграции к новой БД.
    - make migrate
    - make backup
    - pg_restore --list backups/ci.dump > reports/backup-contents.txt
    - make restore DUMP=backups/ci.dump
    - python -m flask --app run db current > reports/restored-migration.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths: [backups/ci.dump, reports/backup-contents.txt, reports/restored-migration.txt]

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.24.3
    entrypoint: [""]
  tags: [lab5-python]
  needs: [{job: backup, artifacts: false}]
  before_script:
    - set -eu
    - apk add --no-cache make
    - mkdir -p reports
  script:
    - make security-secrets
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/gitleaks.sarif]

pip-audit:
  extends: .python-job
  stage: security
  needs: [{job: backup, artifacts: false}]
  script:
    - make security-deps
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/pip-audit.json]

trivy-fs:
  stage: security
  image:
    name: aquasec/trivy:0.76.1
    entrypoint: [""]
  tags: [lab5-python]
  needs: [{job: backup, artifacts: false}]
  before_script:
    - set -eu
    - apk add --no-cache make
    - mkdir -p reports
  script:
    - make security-fs
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/trivy-fs.sarif]

container-check:
  extends: .docker-job
  stage: container-check
  needs: [gitleaks, pip-audit, trivy-fs]
  script:
    - |
      export COMPOSE_PROJECT_NAME="lab5-${CI_PIPELINE_ID}-${CI_JOB_ID}"
      export POSTGRES_USER=studenttrack_ci
      export POSTGRES_DB=studenttrack_ci
      export POSTGRES_PASSWORD="${CI_JOB_TOKEN}"
      export SECRET_KEY="${CI_JOB_TOKEN}"
      cp .env.example .env
      cleanup() {
        docker compose logs --no-color > reports/compose.log 2>&1 || true
        docker compose down -v --remove-orphans || true
        rm -f .env
      }
      trap cleanup EXIT
      make container-check PYTHON=python3 2>&1 | tee reports/container-check.log
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/container-check.log, reports/compose.log]

build:
  extends: .docker-job
  stage: build
  needs: [{job: container-check, artifacts: false}]
  cache:
    key: "buildkit-${CI_COMMIT_REF_SLUG}"
    paths: [.cache/buildkit/]
  script:
    - |
      builder="lab5-${CI_JOB_ID}"
      trap 'docker buildx rm "${builder}" >/dev/null 2>&1 || true' EXIT
      docker buildx create --name "${builder}" --driver docker-container --use
      docker buildx inspect --bootstrap
      cache_args=()
      if [ -f .cache/buildkit/index.json ]; then
        cache_args=(--cache-from "type=local,src=.cache/buildkit")
      fi
      mkdir -p .cache
      rm -rf .cache/buildkit-next
      docker buildx build --pull --load "${cache_args[@]}" \
        --cache-to "type=local,dest=.cache/buildkit-next,mode=max" \
        --tag "${IMAGE_REF}" --file Dockerfile . 2>&1 | tee reports/build.log
      rm -rf .cache/buildkit
      mv .cache/buildkit-next .cache/buildkit
      docker save "${IMAGE_REF}" | gzip > image.tar.gz
  artifacts:
    when: always
    expire_in: 30 days
    paths: [image.tar.gz, reports/build.log]

trivy-image:
  stage: build
  image:
    name: aquasec/trivy:0.76.1
    entrypoint: [""]
  tags: [lab5-python]
  needs: [{job: build, artifacts: true}]
  before_script:
    - set -eu
    - apk add --no-cache make
    - mkdir -p reports
  script:
    - make security-image
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/trivy-image.sarif]

publish:
  extends: .docker-job
  stage: publish
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
  needs:
    - {job: config-guard, artifacts: false}
    - {job: lint, artifacts: false}
    - {job: test, artifacts: false}
    - {job: coverage, artifacts: false}
    - {job: health, artifacts: false}
    - {job: migrations, artifacts: false}
    - {job: backup, artifacts: false}
    - {job: gitleaks, artifacts: false}
    - {job: pip-audit, artifacts: false}
    - {job: trivy-fs, artifacts: false}
    - {job: container-check, artifacts: false}
    - {job: build, artifacts: true}
    - {job: trivy-image, artifacts: false}
  script:
    - |
      export DOCKER_CONFIG="$(mktemp -d)"
      trap 'rm -rf "${DOCKER_CONFIG}"' EXIT
      if [ -n "${LAB_REGISTRY_HOST:-}" ]; then
        : "${REGISTRY_USER:?Не задан REGISTRY_USER}"
        : "${REGISTRY_PASSWORD:?Не задан REGISTRY_PASSWORD}"
        printf '%s' "${REGISTRY_PASSWORD}" | docker login "${IMAGE_REGISTRY}" \
          --username "${REGISTRY_USER}" --password-stdin
      else
        printf '%s' "${CI_REGISTRY_PASSWORD}" | docker login "${CI_REGISTRY}" \
          --username "${CI_REGISTRY_USER}" --password-stdin
      fi
      docker load --input image.tar.gz
      docker push "${IMAGE_REF}"
      git fetch --no-tags origin main
      if [ "$(git rev-parse origin/main)" = "${CI_COMMIT_SHA}" ]; then
        docker tag "${IMAGE_REF}" "${IMAGE_REPOSITORY}:latest"
        docker push "${IMAGE_REPOSITORY}:latest"
      else
        echo 'main обновилась: latest не перезаписываем старым образом.'
      fi
