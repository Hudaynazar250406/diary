workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'

stages:
  - lint
  - test
  - migrations
  - backup
  - security
  - container-check
  - build
  - container-scan
  - publish

variables:
  GIT_DEPTH: "0"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

default:
  interruptible: true
  hooks:
    pre_get_sources_script:
      - git config --global url."http://host.docker.internal:8929/".insteadOf "http://localhost:8929/"

.check-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'

.postgres-job:
  extends: .dind-python-job
  services:
    - name: local/dind:28
      alias: docker
    - name: postgres:15
      alias: postgres
  variables:
    POSTGRES_USER: studenttrack_ci
    POSTGRES_DB: studenttrack_test
    POSTGRES_PASSWORD: "$TEST_DB_PASSWORD"
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: studenttrack_ci
    PGDATABASE: studenttrack_test
    PGPASSWORD: "$TEST_DB_PASSWORD"
    SECRET_KEY: "$TEST_DB_PASSWORD"
    PYTEST_WORKERS: "0"
  before_script:
    - !reference [.dind-python-job, before_script]
    - export DATABASE_URL="postgresql+psycopg://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
    - export TEST_DATABASE_URL="${DATABASE_URL}"
    - for attempt in $(seq 1 60); do pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" && break; test "$attempt" = 60 && exit 1; sleep 2; done
    - psql --no-password -v ON_ERROR_STOP=1 -Atqc "SELECT 1"

config-guard:
  extends: .dind-job
  stage: lint
  image: local/dind-cli:28
  before_script:
    - set -eu
    - !reference [.dind-job, before_script]
    - apk add --no-cache git bash
    - mkdir -p reports
  script:
    - git fetch --no-tags origin "${CI_DEFAULT_BRANCH}" || true
    - test -f scripts/check_critical_files.sh
    - bash scripts/check_critical_files.sh | tee reports/config-guard.log
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/config-guard.log]

lint:
  extends: .dind-python-job
  stage: lint
  needs: [{job: config-guard, artifacts: false}]
  script: [make quality]
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/flake8.log]

test:
  extends: .postgres-job
  stage: test
  needs: [{job: lint, artifacts: false}]
  variables:
    PYTEST_ADDOPTS: "--junitxml=reports/junit.xml"
  script:
    - python -m pytest -v -n 0
  artifacts:
    when: always
    expire_in: 30 days
    reports: {junit: reports/junit.xml}
    paths: [reports/junit.xml]

coverage:
  extends: .postgres-job
  stage: test
  needs: [{job: lint, artifacts: false}]
  script:
    - python -m pytest --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=80 -q -n 0
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
    paths: [reports/coverage.xml]

health:
  extends: .postgres-job
  stage: test
  needs: [{job: lint, artifacts: false}]
  script: [make health]
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/health.log]

migrations:
  extends: .postgres-job
  stage: migrations
  needs:
    - {job: test, artifacts: false}
    - {job: coverage, artifacts: false}
    - {job: health, artifacts: false}
  script:
    - CI=true python -m flask --app run db upgrade 2>&1 | tee reports/migrations.log
    - python -m flask --app run db current >> reports/migrations.log
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/migrations.log]

backup:
  extends: .postgres-job
  stage: backup
  needs: [{job: migrations, artifacts: false}]
  script:
    - pg_dump --no-password --format=custom --file=backups/ci.dump
    - pg_restore --list backups/ci.dump > reports/backup-contents.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths: [backups/ci.dump, reports/backup-contents.txt]

gitleaks:
  extends: .dind-job
  stage: security
  needs: [{job: config-guard, artifacts: false}]
  script:
    - mkdir -p reports
    - docker create --name gitleaks-check --entrypoint sh zricethezav/gitleaks:v8.24.3 -c 'sleep 600'
    - docker cp . gitleaks-check:/workspace
    - docker start gitleaks-check
    - set +e
    - docker exec gitleaks-check gitleaks git /workspace --redact --exit-code 1 --report-format sarif --report-path /workspace/reports/gitleaks.sarif
    - status=$?
    - set -e
    - docker cp gitleaks-check:/workspace/reports/. reports/ || true
    - docker rm -f gitleaks-check
    - test "$status" -eq 0
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/gitleaks.sarif]

pip-audit:
  extends: .dind-python-job
  stage: security
  needs: [{job: config-guard, artifacts: false}]
  script:
    - python -m pip install pip-audit==2.9.0
    - python -m pip_audit --requirement requirements.txt --format=json --output=reports/pip-audit.json
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/pip-audit.json]

trivy-fs:
  extends: .dind-job
  stage: security
  needs: [{job: config-guard, artifacts: false}]
  script:
    - mkdir -p reports
    - docker create --name trivy-fs-check --entrypoint sh aquasec/trivy:0.76.1 -c 'sleep 600'
    - docker cp . trivy-fs-check:/workspace
    - docker start trivy-fs-check
    - set +e
    - docker exec trivy-fs-check trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --format sarif --output /workspace/reports/trivy-fs.sarif /workspace
    - status=$?
    - set -e
    - docker cp trivy-fs-check:/workspace/reports/. reports/ || true
    - docker rm -f trivy-fs-check
    - test "$status" -eq 0
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/trivy-fs.sarif]

# Все docker-операции выполняются в Docker-in-Docker:
# job-контейнер (local/dind-cli:28) общается с изолированным daemon
# (сервис local/dind:28) по TLS. Сокет хоста не монтируется.
.dind-job:
  extends: .check-rules
  tags: [lab5-python]
  image: local/dind-cli:28
  services:
    - name: local/dind:28
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - set -eu
    - mkdir -p reports
    - |
      for attempt in $(seq 1 60); do
        docker info >/dev/null 2>&1 && break
        if test "$attempt" = 60; then
          docker info
          exit 1
        fi
        sleep 2
      done
    - docker version
    - docker compose version
    - docker buildx version

.dind-python-job:
  extends: .dind-job
  cache:
    key:
      files: [requirements.txt]
    paths: [.cache/pip/]
  before_script:
    - set -eu
    - !reference [.dind-job, before_script]
    - apk add --no-cache git bash python3 py3-virtualenv postgresql-client
    - python3 -m venv .venv-ci
    - . .venv-ci/bin/activate
    - python -m pip install -r requirements.txt
    - mkdir -p reports backups

container-check:
  extends: .dind-job
  stage: container-check
  needs:
    - {job: gitleaks, artifacts: false}
    - {job: pip-audit, artifacts: false}
    - {job: trivy-fs, artifacts: false}
  script:
    - export COMPOSE_PROJECT_NAME="lab5-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    - export POSTGRES_USER=studenttrack_ci POSTGRES_DB=studenttrack_ci POSTGRES_PASSWORD="$TEST_DB_PASSWORD" SECRET_KEY="$TEST_DB_PASSWORD"
    # Каждый job получает отдельный DinD daemon, поэтому порт выбирается
    # внутри его namespace и доступен job-контейнеру через alias docker
    - export CHECK_HOST=docker
    - export NGINX_PORT=8080
    - cp .env.example .env
    - trap 'docker compose logs --no-color > reports/compose.log 2>&1 || true; docker compose down -v --remove-orphans || true; rm -f .env' EXIT
    - make container-check PYTHON=python3 2>&1 | tee reports/container-check.log
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/container-check.log, reports/compose.log]

build:
  extends: .dind-job
  stage: build
  needs: [{job: container-check, artifacts: false}]
  script:
    - builder="lab5-${CI_JOB_ID}"
    - trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
    - docker buildx create --name "$builder" --driver docker-container --use
    - docker buildx inspect --bootstrap
    - docker buildx build --load --tag "studenttrack:${CI_COMMIT_SHA}" --file Dockerfile . 2>&1 | tee reports/build.log
    - docker save "studenttrack:${CI_COMMIT_SHA}" | gzip > image.tar.gz
  artifacts:
    when: always
    expire_in: 30 days
    paths: [image.tar.gz, reports/build.log]

trivy-image:
  extends: .dind-job
  stage: container-scan
  needs: [{job: build, artifacts: true}]
  script:
    - mkdir -p reports
    - docker create --name trivy-image-check --entrypoint sh aquasec/trivy:0.76.1 -c 'sleep 600'
    - docker cp image.tar.gz trivy-image-check:/workspace/image.tar.gz
    - docker start trivy-image-check
    - set +e
    - docker exec trivy-image-check trivy image --input /workspace/image.tar.gz --scanners vuln,secret --severity HIGH,CRITICAL --format sarif --output /workspace/reports/trivy-image.sarif
    - status=$?
    - set -e
    - docker cp trivy-image-check:/workspace/reports/. reports/ || true
    - docker rm -f trivy-image-check
    - test "$status" -eq 0
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/trivy-image.sarif]

publish:
  extends: .dind-job
  stage: publish
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "chore/local-gitlab-ci"'
  needs:
    - {job: build, artifacts: true}
    - {job: trivy-image, artifacts: false}
  script:
    - test -n "${CI_REGISTRY:-}" || { echo "Registry is not configured"; exit 1; }
    - test -n "${CI_REGISTRY_IMAGE:-}" || { echo "CI_REGISTRY_IMAGE is not set"; exit 1; }
    - export DOCKER_CONFIG="$(mktemp -d)"
    - trap 'rm -rf "$DOCKER_CONFIG"' EXIT
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker load --input image.tar.gz
    - docker tag "studenttrack:${CI_COMMIT_SHA}" "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
    - docker push "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"