# Nginx — единая точка входа в контейнерное окружение.
#
# Балансировка между репликами сервиса web (docker compose deploy.replicas):
# встроенный DNS Docker (127.0.0.11) возвращает для имени "web" адреса всех
# реплик, resolver с valid=5s заставляет nginx периодически перечитывать их.
# proxy_next_upstream обеспечивает повтор запроса на другой экземпляр,
# если текущий недоступен (отказоустойчивость).

resolver 127.0.0.11 valid=5s;

# Зона для ограничения частоты: 10 запросов/сек с одного IP.
# 10 МБ памяти — примерно на 160 000 уникальных адресов.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    location / {
        # Имя upstream через переменную: без этого nginx резолвит "web"
        # один раз при старте и не видит новые/ушедшие реплики.
        set $upstream "web";
        proxy_pass http://$upstream:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;

        # Отказоустойчивость: повтор неудачного запроса на другой экземпляр.
        # По умолчанию повторяются только идемпотентные методы
        # (GET, HEAD, PUT, DELETE, OPTIONS, TRACE) — POST не дублируется.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Ограничение частоты: 10 req/s на IP, всплеск до 20, при превышении 429.
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
    }

    # Health-эндпоинт без rate limit — чтобы healthcheck Docker и мониторинг
    # не получали 429 из-за чужих запросов.
    location = /health {
        set $upstream "web";
        proxy_pass http://$upstream:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}